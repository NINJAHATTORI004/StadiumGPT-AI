name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stadiumgpt
          POSTGRES_PASSWORD: stadiumgpt
          POSTGRES_DB: stadiumgpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stadiumgpt -d stadiumgpt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://stadiumgpt:stadiumgpt@localhost:5432/stadiumgpt?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret
          NEXTAUTH_SECRET: ci-secret

