services:
  - type: web
    name: stadiumgpt-backend
    env: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://stadiumgpt-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: stadiumgpt-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ZENMUX_API_KEY
        sync: false
      - key: ZENMUX_MODEL
        value: openai/gpt-5
      - key: ZENMUX_BASE_URL
        value: https://zenmux.ai/api/v1
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: stadiumgpt-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd .. && npm install && cd frontend && npm run build
    startCommand: node .next-build/standalone/server.js
    healthCheckPath: /
    rootDir: frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://stadiumgpt-backend.onrender.com/api
      - key: NEXT_PUBLIC_APP_URL
        value: https://stadiumgpt-frontend.onrender.com
      - key: NEXTAUTH_URL
        value: https://stadiumgpt-frontend.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"

databases:
  - name: stadiumgpt-db
    plan: starter
    databaseName: stadiumgpt
    user: stadiumgpt
    postgresMajorVersion: 16
    ipAllowList: []